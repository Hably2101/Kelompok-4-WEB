<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/styles1.css">
    <title>Dasbor Admin Web</title>
    <link rel="icon" href="/assets/logo-kelompok-4.png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <img src="/assets/logo-kelompok-4.png" alt="Profil Admin">
            <h2>Menu</h2>
            <ul>
                <li><a href="#" class="active">Dashboard</a></li>
                <li><a href="homepage-percobaan.html">Aplikasi</a></li>
                <li><a href="index.html">Keluar</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <header>
                <h1>Dasbor Admin</h1>
            </header>
            <section class="form-section">
                <h2>Kelola Pengguna</h2>
                <form id="userForm">
                    <input type="text" id="fullname" placeholder="Nama Lengkap" required>
                    <input type="email" id="gmail" placeholder="Email" required>
                    <input type="text" id="username" placeholder="ID Pengguna" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="button" id="saveButton">Simpan</button>
                    <button type="button" id="clearButton" onclick="clearForm()">Batal</button>
                </form>
            </section>
            <section class="table-section">
                <h2>Daftar Pengguna</h2>
                <table id="userTable">
                    <thead>
                        <tr>
                            <th>Nama Pengguna</th>
                            <th>Email</th>
                            <th>ID</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data pengguna akan ditambahkan di sini -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>
    <script src="/js/script2.js"></script>
</body>
</html>
